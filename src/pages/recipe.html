<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Receta</title>
        <link rel="stylesheet" href="/assets/css/style.css">
        <link rel="shortcut icon" href="/assets/images/logo.png" type="image/x-icon">
    </head>
    <body>
        <!-- Esqueleto para las recetas, se generan dinámicamente-->
        <section id="container">
            <input id="goBack1" class="goBack" type="image" src="/assets/images/volver.png" height="20px"
                alt="imagen con forma de semicírculo acabado en una flecha hacia la izquierda, que permite volver hacia la página principal con la tecla enter.">
            <button class="tittleButtonTextCenter" id="recipe-title"></button>
            <section class="recipe">
                <div class="row">
                    <div class="column">
                        <input id="recipe-photo" class="images" type="image" />
                    </div>
                    <div class="column">
                        <button class="buttonText" id="recipe-info"></button>
                        <button class="buttonText" id="recipe-description"></button>
                        <button class="buttonText"> Ingredientes (<span id="diners"></span> comensales):</button>
                        <ul id="ingredients-list"></ul>
                    </div>
                </div>
                <div class="row">
                    <div class="column">
                        <button class="buttonText">Preparación (<span id="stepsCount"></span> pasos):</button>
                        <div id="steps-list"></div>
                    </div>
                </div>
            </section>
            <input id="goBack2" class="goBack" type="image" src="/assets/images/volver.png" height="20px"
                alt="imagen con forma de semicírculo acabado en una flecha hacia la izquierda, que permite volver hacia la página principal con la tecla enter. Final de página.">
        </section>
        <footer></footer>
        <script type="module" src="/src/js/recipes.js"></script>
    </body>
</html>
